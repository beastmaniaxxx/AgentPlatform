name: agentplatform

# dify-api / dify-worker / dify-worker-beatで共有するDify環境変数。
# いずれもlanggenius/dify-api:1.14.2イメージをMODE違いで起動し、同一の
# DB/Redis/ベクトルストア/Sandbox/Plugin Daemon設定を必要とするため、
# YAMLアンカーで重複を避ける。
x-dify-app-env: &dify-app-env
  SECRET_KEY: ${DIFY_SECRET_KEY}
  MIGRATION_ENABLED: "true"
  # --- データベース（dify-db） ---
  DB_TYPE: postgresql
  DB_USERNAME: ${DIFY_DB_USERNAME}
  DB_PASSWORD: ${DIFY_DB_PASSWORD}
  DB_HOST: dify-db
  DB_PORT: "5432"
  DB_DATABASE: ${DIFY_DB_DATABASE}
  # --- Redis（dify-redis） ---
  REDIS_HOST: dify-redis
  REDIS_PORT: "6379"
  REDIS_USERNAME: ""
  REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD}
  REDIS_USE_SSL: "false"
  REDIS_DB: "0"
  CELERY_BROKER_URL: redis://:${DIFY_REDIS_PASSWORD}@dify-redis:6379/1
  # --- ベクトルストア（dify-dbのpgvector拡張を共用） ---
  VECTOR_STORE: pgvector
  PGVECTOR_HOST: dify-db
  PGVECTOR_PORT: "5432"
  PGVECTOR_USER: ${DIFY_DB_USERNAME}
  PGVECTOR_PASSWORD: ${DIFY_DB_PASSWORD}
  PGVECTOR_DATABASE: ${DIFY_DB_DATABASE}
  STORAGE_TYPE: opendal
  OPENDAL_SCHEME: fs
  OPENDAL_FS_ROOT: storage
  # --- SSRF Proxy（dify-ssrf-proxy） ---
  SSRF_PROXY_HTTP_URL: http://dify-ssrf-proxy:3128
  SSRF_PROXY_HTTPS_URL: http://dify-ssrf-proxy:3128
  # --- Code Execution（dify-sandbox） ---
  CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
  CODE_EXECUTION_API_KEY: ${DIFY_SANDBOX_API_KEY}
  # --- Plugin Daemon（dify-plugin-daemon） ---
  PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
  PLUGIN_DAEMON_KEY: ${DIFY_PLUGIN_DAEMON_KEY}
  INNER_API_KEY_FOR_PLUGIN: ${DIFY_PLUGIN_INNER_API_KEY}
  PLUGIN_REMOTE_INSTALL_HOST: dify-plugin-daemon
  PLUGIN_REMOTE_INSTALL_PORT: "5003"
  PLUGIN_MAX_PACKAGE_SIZE: "52428800"
  FORCE_VERIFYING_SIGNATURE: "true"
  # --- 公開URL（個人ローカル利用のためnginxを介さずホストポートを直接指定） ---
  CONSOLE_API_URL: http://localhost:${DIFY_API_PORT}
  CONSOLE_WEB_URL: http://localhost:${DIFY_WEB_PORT}
  SERVICE_API_URL: http://localhost:${DIFY_API_PORT}
  APP_API_URL: http://localhost:${DIFY_API_PORT}
  APP_WEB_URL: http://localhost:${DIFY_WEB_PORT}
  FILES_URL: http://localhost:${DIFY_API_PORT}

networks:
  agentplatform-net:
    name: agentplatform-net
    driver: bridge

volumes:
  open-webui-data:
  ollama-data:
  searxng-data:
  dify-db-data:
  dify-redis-data:
  dify-sandbox-dependencies:
  dify-sandbox-conf:
  dify-plugin-daemon-storage:
  dify-app-storage:
  imgpush-data:

services:
  ollama:
    image: ollama/ollama:latest
    networks:
      - agentplatform-net
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama-data:/root/.ollama
      - ${LMSTUDIO_MODELS_PATH}:/lmstudio-models:ro

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    networks:
      - agentplatform-net
    depends_on:
      - ollama
    env_file:
      - .env
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT}:8080"
    volumes:
      - open-webui-data:/app/backend/data

  searxng:
    image: searxng/searxng:latest
    networks:
      - agentplatform-net
    # env_fileは付与しない: このイメージはSEARXNG_PORTをコンテナ内部のリスニングポートとして
    # 解釈するため、ホスト側ポート用の.envのSEARXNG_PORTを渡すと内部ポートとport mapping
    # （${SEARXNG_PORT}:8080）が不整合になる。settings.ymlは環境変数に依存しないため不要。
    ports:
      - "127.0.0.1:${SEARXNG_PORT}:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  dify-db:
    image: pgvector/pgvector:pg16
    networks:
      - agentplatform-net
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DIFY_DB_USERNAME}
      - POSTGRES_PASSWORD=${DIFY_DB_PASSWORD}
      - POSTGRES_DB=${DIFY_DB_DATABASE}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - dify-db-data:/var/lib/postgresql/data
      - ./dify/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DIFY_DB_USERNAME}", "-d", "${DIFY_DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 30

  dify-redis:
    image: redis:6-alpine
    networks:
      - agentplatform-net
    env_file:
      - .env
    command: redis-server --requirepass ${DIFY_REDIS_PASSWORD}
    volumes:
      - dify-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${DIFY_REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  dify-ssrf-proxy:
    image: ubuntu/squid:latest
    networks:
      - agentplatform-net
    depends_on:
      dify-sandbox:
        condition: service_healthy
    volumes:
      - ./dify/ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template
      - ./dify/ssrf_proxy/docker-entrypoint.sh:/docker-entrypoint-mount.sh
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    environment:
      - HTTP_PORT=3128
      - COREDUMP_DIR=/var/spool/squid
      - REVERSE_PROXY_PORT=8194
      - SANDBOX_HOST=dify-sandbox
      - SANDBOX_PORT=8194

  dify-sandbox:
    image: langgenius/dify-sandbox:0.2.15
    networks:
      - agentplatform-net
    env_file:
      - .env
    environment:
      - API_KEY=${DIFY_SANDBOX_API_KEY}
      - GIN_MODE=release
      - WORKER_TIMEOUT=15
      - ENABLE_NETWORK=true
      - HTTP_PROXY=http://dify-ssrf-proxy:3128
      - HTTPS_PROXY=http://dify-ssrf-proxy:3128
      - SANDBOX_PORT=8194
    volumes:
      - dify-sandbox-dependencies:/dependencies
      - dify-sandbox-conf:/conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  dify-plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.6.1-local
    networks:
      - agentplatform-net
    env_file:
      - .env
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    environment:
      # dify-dbへの接続（dify_pluginデータベースはdocker/dify/db-init/で初回起動時に作成される）
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_USERNAME=${DIFY_DB_USERNAME}
      - DB_PASSWORD=${DIFY_DB_PASSWORD}
      - DB_DATABASE=dify_plugin
      - DB_SSL_MODE=disable
      # dify-redisへの接続
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${DIFY_REDIS_PASSWORD}
      - REDIS_USE_SSL=false
      # Plugin Daemon自身の設定
      - SERVER_PORT=5002
      - SERVER_KEY=${DIFY_PLUGIN_DAEMON_KEY}
      - MAX_PLUGIN_PACKAGE_SIZE=52428800
      - PPROF_ENABLED=false
      - PLUGIN_REMOTE_INSTALLING_HOST=0.0.0.0
      - PLUGIN_REMOTE_INSTALLING_PORT=5003
      - PLUGIN_WORKING_PATH=/app/storage/cwd
      - FORCE_VERIFYING_SIGNATURE=true
      - PYTHON_ENV_INIT_TIMEOUT=120
      - PLUGIN_MAX_EXECUTION_TIMEOUT=600
      - PLUGIN_STDIO_BUFFER_SIZE=1024
      - PLUGIN_STDIO_MAX_BUFFER_SIZE=5242880
      - PLUGIN_STORAGE_TYPE=local
      - PLUGIN_STORAGE_LOCAL_ROOT=/app/storage
      - PLUGIN_INSTALLED_PATH=plugin
      - PLUGIN_PACKAGE_CACHE_PATH=plugin_packages
      - PLUGIN_MEDIA_CACHE_PATH=assets
      # dify-apiの内部APIへの接続
      - DIFY_INNER_API_URL=http://dify-api:5001
      - DIFY_INNER_API_KEY=${DIFY_PLUGIN_INNER_API_KEY}
    volumes:
      - dify-plugin-daemon-storage:/app/storage

  dify-api:
    image: langgenius/dify-api:1.14.2
    networks:
      - agentplatform-net
    env_file:
      - .env
    environment:
      <<: *dify-app-env
      MODE: api
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-sandbox:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_started
    ports:
      - "127.0.0.1:${DIFY_API_PORT}:5001"
    volumes:
      - dify-app-storage:/app/api/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  dify-worker:
    image: langgenius/dify-api:1.14.2
    networks:
      - agentplatform-net
    env_file:
      - .env
    environment:
      <<: *dify-app-env
      MODE: worker
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-sandbox:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_started
    volumes:
      - dify-app-storage:/app/api/storage

  dify-worker-beat:
    image: langgenius/dify-api:1.14.2
    networks:
      - agentplatform-net
    env_file:
      - .env
    environment:
      <<: *dify-app-env
      MODE: beat
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-sandbox:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_started
    volumes:
      - dify-app-storage:/app/api/storage

  dify-web:
    image: langgenius/dify-web:1.14.2
    networks:
      - agentplatform-net
    env_file:
      - .env
    environment:
      # nginxを介さずブラウザから直接dify-apiへアクセスするため、
      # コンテナ名ではなくホスト公開ポート（localhost）を指定する。
      CONSOLE_API_URL: http://localhost:${DIFY_API_PORT}
      APP_API_URL: http://localhost:${DIFY_API_PORT}
    depends_on:
      dify-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DIFY_WEB_PORT}:3000"

  imgpush:
    image: hauxir/imgpush:latest
    networks:
      - agentplatform-net
    ports:
      - "127.0.0.1:${IMGPUSH_PORT}:5000"
    volumes:
      - imgpush-data:/images
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/liveness"]
      interval: 10s
      timeout: 5s
      retries: 10

  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    networks:
      - agentplatform-net
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PIPELINES_PORT}:9099"
    volumes:
      - ../pipelines:/app/pipelines
