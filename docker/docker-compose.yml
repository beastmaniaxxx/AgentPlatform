name: agentplatform

networks:
  agentplatform-net:
    name: agentplatform-net
    driver: bridge

volumes:
  open-webui-data:
  ollama-data:
  searxng-data:

services:
  ollama:
    image: ollama/ollama:latest
    networks:
      - agentplatform-net
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama-data:/root/.ollama
      - ${LMSTUDIO_MODELS_PATH}:/lmstudio-models:ro
