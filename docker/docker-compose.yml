name: agentplatform

networks:
  agentplatform-net:
    name: agentplatform-net
    driver: bridge

volumes:
  open-webui-data:
  ollama-data:
  searxng-data:
  dify-db-data:
  dify-redis-data:
  dify-sandbox-dependencies:
  dify-sandbox-conf:
  dify-plugin-daemon-storage:

services:
  ollama:
    image: ollama/ollama:latest
    networks:
      - agentplatform-net
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama-data:/root/.ollama
      - ${LMSTUDIO_MODELS_PATH}:/lmstudio-models:ro

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    networks:
      - agentplatform-net
    depends_on:
      - ollama
    env_file:
      - .env
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT}:8080"
    volumes:
      - open-webui-data:/app/backend/data

  searxng:
    image: searxng/searxng:latest
    networks:
      - agentplatform-net
    # env_fileは付与しない: このイメージはSEARXNG_PORTをコンテナ内部のリスニングポートとして
    # 解釈するため、ホスト側ポート用の.envのSEARXNG_PORTを渡すと内部ポートとport mapping
    # （${SEARXNG_PORT}:8080）が不整合になる。settings.ymlは環境変数に依存しないため不要。
    ports:
      - "127.0.0.1:${SEARXNG_PORT}:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  dify-db:
    image: pgvector/pgvector:pg16
    networks:
      - agentplatform-net
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DIFY_DB_USERNAME}
      - POSTGRES_PASSWORD=${DIFY_DB_PASSWORD}
      - POSTGRES_DB=${DIFY_DB_DATABASE}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - dify-db-data:/var/lib/postgresql/data
      - ./dify/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DIFY_DB_USERNAME}", "-d", "${DIFY_DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 30

  dify-redis:
    image: redis:6-alpine
    networks:
      - agentplatform-net
    env_file:
      - .env
    command: redis-server --requirepass ${DIFY_REDIS_PASSWORD}
    volumes:
      - dify-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${DIFY_REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  dify-ssrf-proxy:
    image: ubuntu/squid:latest
    networks:
      - agentplatform-net
    depends_on:
      dify-sandbox:
        condition: service_healthy
    volumes:
      - ./dify/ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template
      - ./dify/ssrf_proxy/docker-entrypoint.sh:/docker-entrypoint-mount.sh
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    environment:
      - HTTP_PORT=3128
      - COREDUMP_DIR=/var/spool/squid
      - REVERSE_PROXY_PORT=8194
      - SANDBOX_HOST=dify-sandbox
      - SANDBOX_PORT=8194

  dify-sandbox:
    image: langgenius/dify-sandbox:0.2.15
    networks:
      - agentplatform-net
    env_file:
      - .env
    environment:
      - API_KEY=${DIFY_SANDBOX_API_KEY}
      - GIN_MODE=release
      - WORKER_TIMEOUT=15
      - ENABLE_NETWORK=true
      - HTTP_PROXY=http://dify-ssrf-proxy:3128
      - HTTPS_PROXY=http://dify-ssrf-proxy:3128
      - SANDBOX_PORT=8194
    volumes:
      - dify-sandbox-dependencies:/dependencies
      - dify-sandbox-conf:/conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  dify-plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.6.1-local
    networks:
      - agentplatform-net
    env_file:
      - .env
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    environment:
      # dify-dbへの接続（dify_pluginデータベースはdocker/dify/db-init/で初回起動時に作成される）
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_USERNAME=${DIFY_DB_USERNAME}
      - DB_PASSWORD=${DIFY_DB_PASSWORD}
      - DB_DATABASE=dify_plugin
      - DB_SSL_MODE=disable
      # dify-redisへの接続
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${DIFY_REDIS_PASSWORD}
      - REDIS_USE_SSL=false
      # Plugin Daemon自身の設定
      - SERVER_PORT=5002
      - SERVER_KEY=${DIFY_PLUGIN_DAEMON_KEY}
      - MAX_PLUGIN_PACKAGE_SIZE=52428800
      - PPROF_ENABLED=false
      - PLUGIN_REMOTE_INSTALLING_HOST=0.0.0.0
      - PLUGIN_REMOTE_INSTALLING_PORT=5003
      - PLUGIN_WORKING_PATH=/app/storage/cwd
      - FORCE_VERIFYING_SIGNATURE=true
      - PYTHON_ENV_INIT_TIMEOUT=120
      - PLUGIN_MAX_EXECUTION_TIMEOUT=600
      - PLUGIN_STDIO_BUFFER_SIZE=1024
      - PLUGIN_STDIO_MAX_BUFFER_SIZE=5242880
      - PLUGIN_STORAGE_TYPE=local
      - PLUGIN_STORAGE_LOCAL_ROOT=/app/storage
      - PLUGIN_INSTALLED_PATH=plugin
      - PLUGIN_PACKAGE_CACHE_PATH=plugin_packages
      - PLUGIN_MEDIA_CACHE_PATH=assets
      # dify-apiの内部APIへの接続（dify-api追加はタスク2.4）
      - DIFY_INNER_API_URL=http://dify-api:5001
      - DIFY_INNER_API_KEY=${DIFY_PLUGIN_INNER_API_KEY}
    volumes:
      - dify-plugin-daemon-storage:/app/storage
