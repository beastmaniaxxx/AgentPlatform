app:
  description: |-
    画像キャプションを用いた自鯖内マルチモーダルRAGワークフロー。
    テキストクエリ、または画像クエリをVision LLMでキャプション化したテキストをDifyテキストKBへ検索し、filename/title/text/source/scoreへ正規化して count/items/summary を返す。
    インポート後に、Vision LLM、Knowledge RetrievalのテキストKB、要約LLMをDify管理画面でOllama接続済みモデルへ設定すること。
  icon: 🖼️
  icon_background: '#EFF1F5'
  icon_type: emoji
  mode: workflow
  name: multimodal_rag
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/ollama:1.0.0@ae50a2db261bffa7289677f2b0a60e60762ceb187b602113b72425ccbe772dc3
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .jpg
      - .jpeg
      - .png
      - .gif
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - remote_url
      enabled: true
      fileUploadConfig:
