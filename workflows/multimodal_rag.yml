    - data:
        code: |-
          import json

          def _load_result(result):
              if result is None:
                  return []
              if isinstance(result, str):
                  if not result.strip():
                      return []
                  try:
                      return json.loads(result)
                  except Exception:
                      return []
              if isinstance(result, list):
                  return result
              if isinstance(result, dict):
                  for key in ("result", "results", "documents", "records"):
                      value = result.get(key)
                      if isinstance(value, list):
                          return value
                  return [result]
              return []

          def _metadata(record):
              metadata = record.get("metadata") or record.get("document_metadata") or {}
              return metadata if isinstance(metadata, dict) else {}

          def _text(record):
              return (
                  record.get("content")
                  or record.get("text")
                  or record.get("segment")
                  or record.get("document")
                  or ""
              )

          def _score(record):
              value = record.get("score", record.get("similarity", 0))
              try:
                  return float(value)
              except Exception:
                  return 0.0

          def main(result) -> dict:
              items = []
              for record in _load_result(result):
                  if not isinstance(record, dict):
                      continue
                  metadata = _metadata(record)
                  filename = (
                      metadata.get("filename")
                      or record.get("filename")
                      or ""
                  )
                  if not filename:
                      continue
                  title = metadata.get("title") or record.get("title") or filename
                  source = (
                      record.get("source")
                      or metadata.get("source")
                      or metadata.get("document_id")
                      or ""
                  )
                  items.append(
                      {
                          "filename": filename,
                          "title": title,
                          "text": _text(record),
                          "source": source,
                          "score": _score(record),
                      }
                  )
              summary_seed = "\n".join(
                  f"- {item['title']} ({item['filename']}): {item['text']}"
                  for item in items
              )
              return {
                  "count": len(items),
                  "items": json.dumps(items, ensure_ascii=False),
                  "summary_seed": summary_seed,
              }
        code_language: python3
        desc: Knowledge Retrieval結果を filename/title/text/source/score の共通形式へ変換し、関連度順を保持したまま件数を算出する。filename欠落項目は表示できないため除外する。
        outputs:
          count:
            children: null
            type: number
          items:
            children: null
            type: string
          summary_seed:
            children: null
            type: string
        selected: false
        title: 検索結果正規化
        type: code
        variables:
        - value_selector:
          - retrieve_caption_kb
          - result
          variable: result
      height: 231
