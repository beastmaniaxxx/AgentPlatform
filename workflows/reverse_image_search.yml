app:
  description: 'アップロード画像の公開URLをSerpAPI（REVERSE_IMAGE_ENGINE で選択したエンジン）で逆画像検索し、

    類似画像サムネイル（Markdown）と出典サイト一覧をローカルLLMで要約して返すワークフロー。

    対応エンジン: google_lens（既定）/ yandex_images / bing_reverse_image（Dify環境変数 REVERSE_IMAGE_ENGINE
    で切替）。

    インポート後にLLMノードのモデルをOllama接続済みのモデルに設定すること（docs/reverse-image-search-setup.md参照）。

    SERPAPI_KEY（Dify Secret環境変数）と REVERSE_IMAGE_ENGINE（Dify環境変数、既定: google_lens）をDify管理画面で設定すること。'
  icon: 🔎
  icon_background: '#EFF1F5'
  icon_type: emoji
  mode: advanced-chat
  name: reverse_image_search
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/ollama:1.0.0@ae50a2db261bffa7289677f2b0a60e60762ceb187b602113b72425ccbe772dc3
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: 'エンジンは、下記から指定可能

      - google_lens

      - yandex_images

      - bing_reverse_image'
    id: 70c96562-58c7-4a5e-84b3-b37c438942bc
    name: REVERSE_IMAGE_ENGINE
    selector:
    - env
    - REVERSE_IMAGE_ENGINE
    value: bing_reverse_image
    value_type: string
  - description: ''
    id: 2f036a04-8c32-4cea-a9d9-71a420194c9a
    name: SERPAPI_KEY
    selector:
    - env
    - SERPAPI_KEY
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
      - local_file
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInLoop: false
        sourceType: start
        targetType: http-request
      id: start-source-serpapi-target
      source: start
      sourceHandle: source
      target: serpapi_request
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: http-request
        targetType: code
      id: serpapi-source-normalize-target
      source: serpapi_request
      sourceHandle: source
      target: normalize_results
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: code
        targetType: if-else
      id: normalize-source-check-target
      source: normalize_results
      sourceHandle: source
      target: check_count
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: if-else
        targetType: answer
      id: check-true-no-results-target
      source: check_count
      sourceHandle: case_0_results
      target: answer_no_results
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: if-else
        targetType: llm
      id: check-false-summarize-target
      source: check_count
      sourceHandle: 'false'
      target: summarize
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: summarize-source-answer-target
      source: summarize
      sourceHandle: source
      target: answer_results
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables: []
      height: 72
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - type: text
            value: ''
          type: none
        desc: 'SerpAPIの逆画像検索APIを呼び出す。REVERSE_IMAGE_ENGINE で選択したエンジンを使用。

          url と image_url の両方に同じ公開URLを送信（エンジン別パラメータ名の差異を吸収）。

          ユーザー識別情報は付与しない。'
        headers: ''
        method: GET
        params: ''
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 100
        selected: false
        ssl_verify: true
        timeout:
          connect: 60
          read: 60
          write: 20
        title: SerpAPI逆画像検索
        type: http-request
        url: https://serpapi.com/search?engine={{#env.REVERSE_IMAGE_ENGINE#}}&url={{#sys.query#}}&image_url={{#sys.query#}}&api_key={{#env.SERPAPI_KEY#}}
        variables: []
      height: 336
      id: serpapi_request
      position:
        x: 384
        y: 282
      positionAbsolute:
        x: 384
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "import json\n\ndef main(body: str) -> dict:\n  try:\n      data = json.loads(body)\n\
          \  except Exception:\n      return {\"count\": 0, \"markdown\": \"\", \"\
          items\": \"[]\"}\n  if data.get(\"error\"):\n      return {\"count\": 0,\
          \ \"markdown\": \"\", \"items\": \"[]\"}\n  raw_items = (\n      data.get(\"\
          visual_matches\") or\n      data.get(\"images_results\") or\n      data.get(\"\
          image_results\") or\n      data.get(\"related_content\") or\n      data.get(\"\
          inline_images\") or\n      []\n  )\n  items = []\n  markdown_parts = []\n\
          \  for r in raw_items:\n      thumbnail_raw = r.get(\"thumbnail\") or \"\
          \"\n      if isinstance(thumbnail_raw, dict):\n          thumbnail = (\n\
          \              thumbnail_raw.get(\"link\") or\n              thumbnail_raw.get(\"\
          src\") or\n              thumbnail_raw.get(\"url\") or\n              \"\
          \"\n          )\n      else:\n          thumbnail = thumbnail_raw or \"\"\
          \n      if not thumbnail:\n          continue\n      title = r.get(\"title\"\
          , \"\")\n      link = r.get(\"link\") or r.get(\"url\") or r.get(\"source\"\
          ) or \"\"\n      source = r.get(\"source\") or r.get(\"domain\") or r.get(\"\
          displayed_link\") or \"\"\n      items.append({\"title\": title, \"link\"\
          : link, \"source\": source, \"thumbnail\": thumbnail})\n      markdown_parts.append(f\"\
          ![{title}]({thumbnail})\")\n      if len(items) >= 5:\n          break\n\
          \  count = len(items)\n  return {\n      \"count\": count,\n      \"markdown\"\
          : \"\\n\\n\".join(markdown_parts),\n      \"items\": json.dumps(items, ensure_ascii=False)\n\
          \  }"
        code_language: python3
        desc: 'SerpAPIエンジン別の応答（visual_matches / image_results / inline_images）を

          共通形式（title / link / source / thumbnail）へ正規化し、上位5件のMarkdown画像と件数を算出する。

          SerpAPI error フィールド検出時は0件相当として扱う。'
        outputs:
          count:
            children: null
            type: number
          items:
            children: null
            type: string
          markdown:
            children: null
            type: string
        selected: false
        title: 応答正規化
        type: code
        variables:
        - value_selector:
          - serpapi_request
          - body
          variable: body
      height: 191
      id: normalize_results
      position:
        x: 688
        y: 282
      positionAbsolute:
        x: 688
        y: 282
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        cases:
        - case_id: case_0_results
          conditions:
          - comparison_operator: '='
            id: cond_count_zero
            value: '0'
            varType: number
            variable_selector:
            - normalize_results
            - count
          id: case_0_results
          logical_operator: and
        desc: 正規化後の類似画像件数が0かどうかを判定する。
        selected: false
        title: 結果件数チェック
        type: if-else
      height: 167
      id: check_count
      position:
        x: 992
        y: 282
      positionAbsolute:
        x: 992
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: '類似画像と出典サイトを日本語で要約し、各画像に出典リンクを付与する。

          インポート後にモデルをOllama接続済みのモデルに設定すること。'
        model:
          completion_params:
            temperature: 0.5
          mode: chat
          name: gemma-4-31b-heretic
          provider: langgenius/ollama/ollama
        prompt_template:
        - id: prompt_system
          role: system
          text: あなたは逆画像検索の結果を日本語でわかりやすく要約するアシスタントです。各類似画像について簡潔な説明を作成し、必ず出典を付けてください。
        - id: prompt_user
          role: user
          text: '以下の逆画像検索で見つかった類似画像の情報を日本語で要約してください。

            各画像について1〜2文の説明を付け、末尾に `[出典: source](link)` 形式で出典を記載してください。


            類似画像一覧（JSON形式）:

            {{#normalize_results.items#}}'
        selected: false
        title: 要約生成
        type: llm
        variables: []
        vision:
          enabled: false
      height: 163
      id: summarize
      position:
        x: 1296
        y: 182
      positionAbsolute:
        x: 1296
        y: 182
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        answer: '{{#normalize_results.markdown#}}


          ---


          {{#summarize.text#}}'
        desc: ''
        selected: false
        title: 検索結果回答
        type: answer
        variables: []
      height: 120
      id: answer_results
      position:
        x: 1600
        y: 182
      positionAbsolute:
        x: 1600
        y: 182
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        answer: '類似画像が見つかりませんでした。


          別の画像や角度を変えた画像で再度お試しください。'
        desc: ''
        selected: false
        title: 0件通知
        type: answer
        variables: []
      height: 131
      id: answer_no_results
      position:
        x: 1296
        y: 382
      positionAbsolute:
        x: 1296
        y: 382
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: -415.93329129565836
      y: 343.8741563435559
      zoom: 0.9896309330796712
  rag_pipeline_variables: []
