app:
  description: |-
    ユーザーのテキストクエリをSearXNGで検索し、上位5件をLLMで要約して引用元URL付きで返すワークフロー。
    検索結果が0件の場合は再検索を促すメッセージを返す。
    インポート後にLLMノードのモデルをOllama接続済みのモデルに設定すること（docs/web-search-setup.md参照）。
  icon: 🔍
  icon_background: '#EFF1F5'
  mode: advanced-chat
  name: web_search
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
      - local_file
      enabled: false
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInLoop: false
        sourceType: start
        targetType: http-request
      id: start-source-searxng-target
      source: start
      sourceHandle: source
      target: searxng_request
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: http-request
        targetType: code
      id: searxng-source-parse-target
      source: searxng_request
      sourceHandle: source
      target: parse_results
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: code
        targetType: if-else
      id: parse-source-check-target
      source: parse_results
      sourceHandle: source
      target: check_count
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: if-else
        targetType: answer
      id: check-true-no-results-target
      source: check_count
      sourceHandle: case_0_results
      target: answer_no_results
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: if-else
        targetType: llm
      id: check-false-summarize-target
      source: check_count
      sourceHandle: 'false'
      target: summarize
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: summarize-source-answer-target
      source: summarize
      sourceHandle: source
      target: answer_results
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables: []
      height: 54
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: ''
          type: none
        desc: SearXNGのJSON検索APIを呼び出す。ユーザー識別情報は付与しない。
        headers: ''
        method: GET
        params: ''
        selected: false
        timeout:
          connect: 60
          read: 60
          write: 20
        title: SearXNG検索
        type: http-request
        url: 'http://searxng:8080/search?format=json&q={{#sys.query#}}'
        variables: []
      height: 126
      id: searxng_request
      position:
        x: 384
        y: 282
      positionAbsolute:
        x: 384
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\ndef main(body: str) -> dict:\n    data = json.loads(body)\n\
          \    results = data.get(\"results\", [])\n    count = len(results)\n    top5\
          \ = results[:5]\n    items = []\n    for r in top5:\n        items.append({\n\
          \            \"title\": r.get(\"title\", \"\"),\n            \"url\": r.get(\"\
          url\", \"\"),\n            \"content\": r.get(\"content\", \"\")\n      \
          \  })\n    return {\n        \"count\": count,\n        \"items\": json.dumps(items,\
          \ ensure_ascii=False)\n    }\n"
        code_language: python3
        desc: 検索結果JSONを解析し、上位5件のtitle/url/contentを抽出する。
        outputs:
          count:
            children: null
            type: number
          items:
            children: null
            type: string
        selected: false
        title: 結果解析
        type: code
        variables:
        - value_selector:
          - searxng_request
          - body
          variable: body
      height: 126
      id: parse_results
      position:
        x: 688
        y: 282
      positionAbsolute:
        x: 688
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: case_0_results
          conditions:
          - comparison_operator: ==
            id: cond_count_zero
            value: '0'
            varType: number
            variable_selector:
            - parse_results
            - count
          id: case_0_results
          logical_operator: and
        desc: 検索結果が0件かどうかを判定する。
        selected: false
        title: 結果件数チェック
        type: if-else
      height: 126
      id: check_count
      position:
        x: 992
        y: 282
      positionAbsolute:
        x: 992
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: |-
          検索結果の上位5件を要約し、引用元URLを付与して返す。
          インポート後にモデルをOllama接続済みのモデルに設定すること。
        model:
          completion_params:
            temperature: 0.5
          mode: chat
          name: ''
          provider: ''
        prompt_template:
        - id: prompt_system
          role: system
          text: あなたはWebの検索結果を日本語でわかりやすく要約するアシスタントです。各検索結果について簡潔な要約を作成し、必ず引用元URLを付けてください。
        - id: prompt_user
          role: user
          text: "以下の検索結果を日本語で要約してください。\n各要約の末尾には必ず引用元URLを `[出典](URL)` 形式で付けてください。\n\
            \n検索クエリ: {{#sys.query#}}\n\n検索結果（JSON形式）:\n{{#parse_results.items#}}"
        selected: false
        title: 要約生成
        type: llm
        variables: []
        vision:
          enabled: false
      height: 126
      id: summarize
      position:
        x: 1296
        y: 182
      positionAbsolute:
        x: 1296
        y: 182
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#summarize.text#}}'
        desc: ''
        selected: false
        title: 検索結果回答
        type: answer
        variables: []
      height: 105
      id: answer_results
      position:
        x: 1600
        y: 182
      positionAbsolute:
        x: 1600
        y: 182
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: |-
          「{{#sys.query#}}」に関する検索結果が見つかりませんでした。

          別のキーワードや表現で再度検索してみてください。
        desc: ''
        selected: false
        title: 0件通知
        type: answer
        variables: []
      height: 105
      id: answer_no_results
      position:
        x: 1296
        y: 382
      positionAbsolute:
        x: 1296
        y: 382
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.75
